<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#050505" offset="0"/>
      <stop stop-color="#161616" offset="0.52"/>
      <stop stop-color="#000000" offset="1"/>
    </linearGradient>
    <filter id="noise">
